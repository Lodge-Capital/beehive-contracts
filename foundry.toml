[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
script = "script"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
solc = "0.8.26"
auto_detect_solc = false
ffi = false
fs_permissions = [
  { access = "read-write", path = "./config" },
  { access = "read-write", path = "./beehive.config.json" },
  { access = "read", path = "./out" }
]
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
  "script/=script/",
  "contracts/=contracts/"
]

[profile.default.fmt]
line_length = 120
tab_width = 2
bracket_spacing = false
int_types = "long"

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
